spring.application.name: Api_monstres

spring:
  data:
    mongodb:
      uuid-representation: standard
      database: Api_monstres
      port: 27017

gatcha:
  auth-api:
    host: "${AUTH_API_HOST:http://host.docker.internal}"
    port: "${AUTH_API_PORT:8080}"
  # Sidecar dev-token-provider (Story 1.1 / AD-8) — n'a d'effet que si le profil Spring "dev-local"
  # est actif (DEV_LOCAL_SPRING_PROFILE) ; DevAutoAuthConfig ne lit ces propriétés que dans ce cas.
  dev-token-provider:
    host: "${DEV_TOKEN_PROVIDER_HOST:http://dev-token-provider}"
    port: "${DEV_TOKEN_PROVIDER_PORT:9876}"

# Story 2.1 — corrélation X-Request-Id : le pattern console par défaut n'affiche pas le MDC, on
# ajoute donc l'identifiant (clé MDC posée par l'AuthInterceptor) à chaque ligne de log.
logging:
  pattern:
    level: "%5p [%X{X-Request-Id:-}]"
